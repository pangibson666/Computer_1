<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>期中刷題機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面概念：一張「題庫打孔卡」當首頁的進度總覽；刷題時一次一張卡片，作答後立刻展開解析 */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F9F8; --ink:#14282C; --muted:#5A6B6E; --line:#D3DDDB;
  --accent:#0F5E6E; --accent-soft:#DCEDEF; --accent-ink:#FFFFFF;
  --mark:#D46A12; --mark-soft:#FCEBDC;
  --good:#2C7A4B; --good-soft:#E1F2E7; --bad:#B42F3C; --bad-soft:#FBE6E8;
  --hole:#FFFFFF; --hole-line:#B9C7C5; --card:#F7F4EC; --card-line:#E2DCCB;
  --shadow:0 1px 2px rgba(20,40,44,.06),0 6px 20px rgba(20,40,44,.06);
  --f-ui:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-cjk:"Noto Sans TC","PingFang TC","Microsoft JhengHei","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#162225; --surface-2:#1B2A2D; --ink:#E2ECEA; --muted:#93A7A9; --line:#2A3B3E;
  --accent:#58B7C6; --accent-soft:#16363C; --accent-ink:#0B1A1D;
  --mark:#F0A24D; --mark-soft:#3A2A17;
  --good:#5CC489; --good-soft:#163323; --bad:#F27D88; --bad-soft:#3D1C21;
  --hole:#0E1618; --hole-line:#3A4D50; --card:#1E2A2A; --card-line:#33433F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162225; --surface-2:#1B2A2D; --ink:#E2ECEA; --muted:#93A7A9; --line:#2A3B3E;
  --accent:#58B7C6; --accent-soft:#16363C; --accent-ink:#0B1A1D;
  --mark:#F0A24D; --mark-soft:#3A2A17;
  --good:#5CC489; --good-soft:#163323; --bad:#F27D88; --bad-soft:#3D1C21;
  --hole:#0E1618; --hole-line:#3A4D50; --card:#1E2A2A; --card-line:#33433F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.mono{font-family:var(--f-mono)}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- 頁首 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1;flex-wrap:wrap}
.brand h1{font-family:var(--f-cjk);font-weight:900;font-size:1.35rem;letter-spacing:.02em}
.brand .sub{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);letter-spacing:.04em}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--surface)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--hole-line);display:inline-block}
.sync.on i{background:var(--good)} .sync.busy i{background:var(--mark)}

/* ---------- 首頁 ---------- */
.home{display:grid;gap:22px;padding-top:22px}
.lead{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
.lead p{margin:0;color:var(--muted);max-width:52ch;font-size:.95rem}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpi b{display:block;font-family:var(--f-mono);font-size:1.6rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.kpi.good b{color:var(--good)} .kpi.bad b{color:var(--bad)}

/* 打孔卡 */
.card-board{position:relative;background:var(--card);border:1px solid var(--card-line);border-radius:6px;padding:18px 18px 14px 22px;
  clip-path:polygon(18px 0,100% 0,100% 100%,0 100%,0 18px)}
.card-board::before{content:"";position:absolute;left:0;top:0;width:26px;height:26px;background:linear-gradient(135deg,var(--card-line) 50%,transparent 50%);opacity:.9}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.board-head h2{font-family:var(--f-mono);font-size:.78rem;font-weight:600;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.chrow{display:grid;grid-template-columns:3.4rem 1fr;gap:10px;padding-block:8px;border-top:1px dashed var(--card-line)}
.chrow:first-of-type{border-top:0}
.chlabel{font-family:var(--f-mono);font-weight:600;font-size:.82rem;padding-top:2px}
.chlabel small{display:block;font-weight:400;color:var(--muted);font-size:.7rem}
.groups{display:flex;flex-wrap:wrap;gap:10px 16px;min-width:0}
.grp{display:flex;flex-direction:column;gap:4px}
.grp-name{font-size:.68rem;color:var(--muted);letter-spacing:.06em}
.holes{display:flex;flex-wrap:wrap;gap:4px}
.hole{width:11px;height:20px;border-radius:2px;border:1px solid var(--hole-line);background:var(--hole);padding:0}
.hole.ok{background:var(--accent);border-color:var(--accent)}
.hole.ng{background:var(--bad);border-color:var(--bad)}
.hole:hover{transform:translateY(-1px)}
.sw{width:9px;height:15px;border-radius:2px;border:1px solid var(--hole-line);background:var(--hole);display:inline-block}
.sw.ok{background:var(--accent);border-color:var(--accent)} .sw.ng{background:var(--bad);border-color:var(--bad)}

/* 設定 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:grid;gap:16px}
.panel h2{font-family:var(--f-cjk);font-size:1.05rem;font-weight:700}
.field{display:grid;grid-template-columns:5.5rem 1fr;gap:10px;align-items:start}
.field>span{font-size:.85rem;color:var(--muted);padding-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-size:.9rem;transition:background .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{font-family:var(--f-mono);font-size:.75rem;opacity:.75;margin-left:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.warn{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn kbd,.kbd{white-space:nowrap;font-family:var(--f-mono);font-size:.7rem;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.7}
.note{font-size:.8rem;color:var(--muted);margin:0}
.chstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chstat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2);min-width:0}
.chstat h3{font-family:var(--f-mono);font-size:.8rem;font-weight:600}
.chstat p{margin:2px 0 6px;font-size:.78rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--accent)} .bar .b-ng{background:var(--bad)}

/* ---------- 刷題 ---------- */
.practice{padding-top:16px;display:grid;gap:14px}
.rbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rbar .pos{font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.track{flex:1 1 140px;min-width:100px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.score{font-family:var(--f-mono);font-size:.82rem;display:flex;gap:10px}
.score .o{color:var(--good)} .score .x{color:var(--bad)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 20px 18px;display:grid;gap:16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.tag{border-radius:4px;padding:1px 8px;font-weight:600;letter-spacing:.04em}
.tag.tf{background:var(--accent-soft);color:var(--accent)} .tag.mc{background:var(--accent-soft);color:var(--accent)}
.tag.fill,.tag.table{background:var(--mark-soft);color:var(--mark)} .tag.qa{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.qtext{font-family:var(--f-cjk);font-size:1.12rem;line-height:1.8;margin:0}
.qtext b{color:var(--accent)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:2rem 1fr;gap:4px 10px;align-items:start;text-align:left;border:1.5px solid var(--line);border-radius:9px;background:var(--surface-2);padding:11px 14px;font-family:var(--f-cjk);font-size:1rem;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;width:1.7rem;height:1.7rem;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);font-size:.85rem}
.opt .t{padding-top:2px;min-width:0}
.opt .w{grid-column:2;font-size:.84rem;color:var(--muted);line-height:1.6}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.72}
.tfopts{grid-template-columns:1fr 1fr}
.tfopts .opt{grid-template-columns:1fr;justify-items:center;text-align:center;padding:16px}
.tfopts .opt .k{width:auto;height:auto;border:0;background:none;font-size:1.6rem;font-family:var(--f-cjk)}
.tfopts .opt.right .k,.tfopts .opt.wrong .k{background:none;color:inherit}
.tfopts .opt .w{grid-column:1}

input.blank{font:inherit;font-family:var(--f-mono);font-size:.95rem;width:8.5em;max-width:100%;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);color:var(--ink);padding:2px 6px;border-radius:4px 4px 0 0;margin:0 2px}
input.blank.ok{border-color:var(--good);background:var(--good-soft)}
input.blank.ng{border-color:var(--bad);background:var(--bad-soft)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.ft{border-collapse:collapse;width:100%;font-size:.9rem}
table.ft th,table.ft td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.ft th{font-weight:600;font-size:.8rem;color:var(--muted);background:var(--surface-2);white-space:nowrap}
table.ft td:first-child{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
table.ft input{font-family:var(--f-mono);font-size:.88rem;width:100%;min-width:7.5em;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--surface-2);color:var(--ink)}
table.ft.wide input{min-width:23em}
table.ft input.ok{border-color:var(--good);background:var(--good-soft)} table.ft input.ng{border-color:var(--bad);background:var(--bad-soft)}
.cellans{display:block;font-family:var(--f-mono);font-size:.78rem;color:var(--good);margin-top:3px;word-break:break-all}

/* 單字卡 */
.flip{perspective:1400px}
.flip-in{position:relative;display:grid;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:20px;display:grid;gap:14px;align-content:start;min-width:0}
.face.back{transform:rotateY(180deg);background:var(--surface)}
.face.front{cursor:pointer;min-height:15rem}
.hint{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:auto}
.back h4{margin:0;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ans{font-family:var(--f-cjk);line-height:1.8}
.ans ul,.ans ol,.exp ul,.exp ol{margin:.3em 0;padding-left:1.3em}
.ans code,.exp code,.qtext code{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;word-break:break-all}
.selfgrade{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 回饋 */
.fb{border-radius:9px;padding:14px 16px;display:grid;gap:8px;border:1px solid var(--line);background:var(--surface-2);min-width:0}
.fb.ok{border-color:var(--good);background:var(--good-soft)}
.fb.ng{border-color:var(--bad);background:var(--bad-soft)}
.verdict{font-family:var(--f-cjk);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb.ok .verdict{color:var(--good)} .fb.ng .verdict{color:var(--bad)}
.correct{font-family:var(--f-cjk);font-size:.95rem}
.correct b{font-family:var(--f-mono)}
.why h4{margin:0 0 2px;font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.exp{font-family:var(--f-cjk);font-size:.95rem;line-height:1.8;margin:0}
.ref{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.override{justify-self:start;font-size:.8rem;border:1px dashed var(--muted);border-radius:6px;background:transparent;padding:3px 10px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* 結算 */
.summary{padding-top:22px;display:grid;gap:18px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big b{font-family:var(--f-mono);font-size:3rem;font-weight:600;line-height:1}
.big span{color:var(--muted)}
.wlist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.wlist li{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;min-width:0}
.wlist .st{font-family:var(--f-mono);font-weight:700}
.wlist .st.ok{color:var(--good)} .wlist .st.ng{color:var(--bad)}
.wlist .qq{font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.wlist .mm{grid-column:2;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}

@media (max-width:560px){
  .field{grid-template-columns:1fr;gap:6px} .field>span{padding-top:0}
  .chstats{grid-template-columns:1fr}
  .qcard,.face{padding:16px}
  .tfopts .opt{padding:12px}
  .chrow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){.flip-in,.track i,.chip,.opt{transition:none}}
</style>

<header class="top">
  <div class="brand"><h1>期中刷題機</h1><span class="sub">CH1–CH3 · 115 題</span></div>
  <span class="sync" id="sync" title="作答紀錄存在這台裝置的瀏覽器"><i></i><span id="syncText">存在這台裝置</span></span>
</header>

<main class="wrap">
<!-- ================= 首頁 ================= -->
<section id="vHome" class="home">
  <div class="lead">
    <p>電子計算機概論期中題庫。是非、選擇題直接點選；填充題打字作答、自動批改；問答題用單字卡翻面自評。每一題作答後都會告訴你「為什麼是這個答案」。</p>
    <div class="kpis">
      <div class="kpi"><b id="kDone">0</b><span>已作答 / 115</span></div>
      <div class="kpi good"><b id="kOk">0</b><span>目前答對</span></div>
      <div class="kpi bad"><b id="kNg">0</b><span>錯題本</span></div>
    </div>
  </div>

  <div class="card-board" aria-label="題庫進度">
    <div class="board-head">
      <h2>題庫打孔卡</h2>
      <div class="legend"><span><i class="sw"></i>沒做過</span><span><i class="sw ok"></i>最近一次答對</span><span><i class="sw ng"></i>最近一次答錯</span></div>
    </div>
    <div id="board"></div>
    <p class="note" style="margin-top:6px">點任何一個孔，就從那一題開始刷那一組。</p>
  </div>

  <div class="chstats" id="chstats"></div>

  <div class="panel">
    <h2>這一輪要刷什麼</h2>
    <div class="field"><span>章節</span><div class="chips" id="fCh"></div></div>
    <div class="field"><span>題型</span><div class="chips" id="fType"></div></div>
    <div class="field"><span>只出</span><div class="chips" id="fFilter"></div></div>
    <div class="field"><span>順序</span><div class="chips" id="fOrder"></div></div>
    <div class="actions">
      <button class="btn primary" id="startBtn" type="button">開始刷題</button>
      <button class="btn" id="wrongBtn" type="button">只練錯題本</button>
      <button class="btn" id="resumeBtn" type="button" hidden>繼續上一輪</button>
    </div>
    <p class="note">快捷鍵：選擇題按 <span class="kbd">1</span>–<span class="kbd">4</span>、是非題按 <span class="kbd">O</span> / <span class="kbd">X</span>、單字卡按空白鍵翻面，<span class="kbd">Enter</span> 送出或下一題，<span class="kbd">←</span> <span class="kbd">→</span> 前後切換。</p>
  </div>

  <div class="actions" style="justify-content:flex-end">
    <button class="btn warn" id="resetBtn" type="button">清除作答紀錄</button>
  </div>
</section>

<!-- ================= 刷題 ================= -->
<section id="vPractice" class="practice" hidden>
  <div class="rbar">
    <button class="btn" id="exitBtn" type="button">← 回首頁</button>
    <span class="pos" id="pos">1 / 1</span>
    <div class="track"><i id="trackFill" style="width:0"></i></div>
    <span class="score"><span class="o" id="sOk">○ 0</span><span class="x" id="sNg">× 0</span></span>
  </div>
  <div id="stage"></div>
  <div class="nav">
    <button class="btn" id="prevBtn" type="button">← 上一題</button>
    <button class="btn primary" id="nextBtn" type="button">下一題 →</button>
  </div>
</section>

<!-- ================= 結算 ================= -->
<section id="vSummary" class="summary" hidden>
  <div class="big"><b id="sumScore">0 / 0</b><span id="sumText"></span></div>
  <div class="actions">
    <button class="btn primary" id="retryWrongBtn" type="button">再練這輪錯的題目</button>
    <button class="btn" id="homeBtn" type="button">回首頁</button>
  </div>
  <ul class="wlist" id="sumList"></ul>
